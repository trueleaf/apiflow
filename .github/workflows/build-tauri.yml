name: Build Tauri
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and verify
        type: string
        required: false
        default: ''
      verification_only:
        description: Rerun verification for an existing release without rebuilding installers
        type: boolean
        required: false
        default: false
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
concurrency:
  group: tauri-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/web/src-tauri
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:native
      - run: npm run build:web
      - run: npm run pretest:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-test-app
          path: |
            packages/web/src-tauri/target/debug/apiflow-desktop.exe
            packages/web/src-tauri/target/debug/static
          if-no-files-found: error
      - run: npm ci
        working-directory: packages/server
      - run: npm run type-check
        working-directory: packages/server
      - run: npm run build
        working-directory: packages/server
  e2e:
    needs: verify
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: desktop-test-app
          path: packages/web/src-tauri/target/debug
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apiflow-webview2-155
          key: webview2-fixed-155.0.4283.45-x64
      - name: Set up fixed WebView2 runtime
        shell: pwsh
        run: |
          $runtimeDirectory = Join-Path $env:RUNNER_TEMP 'apiflow-webview2-155'
          $runtimeExecutable = Get-ChildItem -LiteralPath $runtimeDirectory -Recurse -Filter msedgewebview2.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$runtimeExecutable) {
            New-Item -ItemType Directory -Path $runtimeDirectory -Force | Out-Null
            $runtimeArchive = Join-Path $env:RUNNER_TEMP 'apiflow-webview2-155.cab'
            Invoke-WebRequest -Uri 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/01b0fbd9-6ea3-4e12-818a-a71f73f3855b/Microsoft.WebView2.FixedVersionRuntime.155.0.4283.45.x64.cab' -OutFile $runtimeArchive
            & "$env:SystemRoot/System32/expand.exe" $runtimeArchive '-F:*' $runtimeDirectory | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'WebView2 解压失败' }
            $runtimeExecutable = Get-ChildItem -LiteralPath $runtimeDirectory -Recurse -Filter msedgewebview2.exe | Select-Object -First 1
          }
          if (!$runtimeExecutable -or $runtimeExecutable.VersionInfo.ProductVersion -ne '155.0.4283.45') { throw 'WebView2 固定版本校验失败' }
          & icacls.exe $runtimeExecutable.DirectoryName /grant '*S-1-15-2-2:(OI)(CI)(RX)' '*S-1-15-2-1:(OI)(CI)(RX)' /T | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 运行时读取权限配置失败' }
          "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER=$($runtimeExecutable.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output '使用 WebView2 固定运行时 155.0.4283.45'
      - name: Verify desktop startup and import
        run: npx playwright test tests/e2e/offline/workbench/addons/import/import-flat-nodes.spec.ts --project desktop --reporter=list
      - run: npx playwright test tests/e2e/offline --project desktop --shard=${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results-${{ matrix.shard }}
          path: |
            packages/web/playwright-report
            packages/web/test-results
  bundle:
    needs: verify
    if: ${{ !inputs.verification_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/web/src-tauri
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
        working-directory: packages/web
      - name: Validate release version and signing configuration
        shell: bash
        env:
          RELEASE_REF: ${{ env.RELEASE_TAG }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("packages/web/package.json", "utf8")).version; if (process.env.RELEASE_REF && process.env.RELEASE_REF !== "v" + version) throw new Error("Tag and package version must match"); if (!process.env.UPDATER_KEY || !process.env.UPDATER_PUBLIC_KEY) throw new Error("Configure TAURI_SIGNING_PRIVATE_KEY secret and TAURI_UPDATER_PUBLIC_KEY variable before release"); const config = JSON.parse(fs.readFileSync("packages/web/src-tauri/tauri.conf.json", "utf8")); if (config.plugins.updater.pubkey !== process.env.UPDATER_PUBLIC_KEY) throw new Error("Configured updater public key must match TAURI_UPDATER_PUBLIC_KEY");'
      - name: Configure optional Apple signing credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; for (const name of ["APPLE_CERTIFICATE", "APPLE_CERTIFICATE_PASSWORD", "APPLE_SIGNING_IDENTITY", "APPLE_ID", "APPLE_PASSWORD", "APPLE_TEAM_ID"]) { const value = process.env[name]; if (value) fs.appendFileSync(process.env.GITHUB_ENV, name + "<<APIFLOW_APPLE_VALUE\n" + value + "\nAPIFLOW_APPLE_VALUE\n"); }'
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        with:
          projectPath: packages/web
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          retryAttempts: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tauri-${{ matrix.target }}
          path: packages/web/src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
  store:
    needs: verify
    if: ${{ !inputs.verification_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            os: windows-latest
          - architecture: arm64
            os: windows-11-vs2026-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/web/src-tauri
          key: store-${{ matrix.architecture }}
      - run: npm ci
      - run: node scripts/build-store.mjs ${{ matrix.architecture == 'arm64' && '--arm64' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-${{ matrix.architecture }}
          path: packages/web/release/*.msix
          if-no-files-found: error
