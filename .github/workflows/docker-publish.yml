name: Publish Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: 已有发布标签，用当前构建配置重新发布该版本镜像
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: server
            image: apiflow-server
            dockerfile: packages/server/Dockerfile
          - service: web
            image: apiflow-web
            dockerfile: packages/web/Dockerfile
          - service: website
            image: apiflow-website
            dockerfile: packages/website/Dockerfile
          - service: mongo
            image: apiflow-mongo
            dockerfile: deploy/mongo/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Checkout current server Dockerfile
        if: ${{ inputs.release_tag && matrix.service == 'server' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-build
          sparse-checkout: packages/server/Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          context: git
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=6,enable=${{ matrix.service == 'mongo' }}
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ matrix.service != 'mongo' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ matrix.service != 'mongo' }}
            type=ref,event=tag,enable=${{ matrix.service != 'mongo' }}
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' && matrix.service != 'mongo' }}
            type=sha,enable=${{ matrix.service != 'mongo' }}
            type=raw,value=latest,enable=${{ matrix.service != 'mongo' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.release_tag && matrix.service == 'server' && '.release-build/packages/server/Dockerfile' || matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
